# ─────────────────────────────────────────────────────────────────────────────
#  Check the Hostinger connection — changes nothing, needs no secrets.
#
#  GitHub → Actions → "Check Hostinger connection" → Run workflow, and enter the
#  "FTP IP (hostname)" from hPanel → Files → FTP Accounts.
#
#  It prints:
#    • the name on the FTP server's encryption certificate — that name (not the IP)
#      is what the FTP_SERVER secret needs, because the deploy checks the certificate;
#    • whether blushpicnic.com answers over HTTP and HTTPS (is SSL switched on?).
# ─────────────────────────────────────────────────────────────────────────────
name: Check Hostinger connection

on:
  workflow_dispatch:
    inputs:
      ftp_host:
        description: FTP IP or host name from hPanel → Files → FTP Accounts
        required: true
        type: string
      site:
        description: Website address to check
        required: false
        default: blushpicnic.com
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FTP server certificate (FTPS, port 21)
        env:
          HOST: ${{ inputs.ftp_host }}
        run: |
          HOST="${HOST#ftp://}"; HOST="${HOST%%/*}"
          echo "Connecting to $HOST:21 with explicit TLS…"
          cert="$(timeout 30 openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" </dev/null 2>/dev/null | openssl x509 2>/dev/null || true)"
          if [ -z "$cert" ]; then
            echo "::error::Couldn't read a certificate from $HOST:21 (FTPS not offered, or the host/IP is wrong)."
            exit 1
          fi
          echo "$cert" | openssl x509 -noout -subject -issuer -enddate
          echo "$cert" | openssl x509 -noout -ext subjectAltName 2>/dev/null || true
          echo "$cert" | openssl x509 -noout -fingerprint -sha256
          names="$( (echo "$cert" | openssl x509 -noout -subject -nameopt multiline | sed -n 's/.*commonName *= *//p'; \
                     echo "$cert" | openssl x509 -noout -ext subjectAltName 2>/dev/null | grep -o 'DNS:[^,]*' | sed 's/DNS://') | sort -u)"
          {
            echo "### FTP certificate for $HOST"
            echo ""
            echo "Use one of these names as the **FTP_SERVER** secret (not the IP address):"
            echo ""
            for n in $names; do echo "- \`$n\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Names on the certificate:"; for n in $names; do echo "  $n"; done

          # The same identity check the Deploy workflow runs before sending the password.
          if timeout 30 openssl s_client -starttls ftp -connect "$HOST:21" -servername "$HOST" -verify_return_error \
               -verify_hostname "deploy-check.hstgr.io" </dev/null 2>&1 | grep -q 'Verify return code: 0 (ok)'; then
            echo "Deploy identity check (valid, trusted *.hstgr.io certificate): PASS"
            echo "" >> "$GITHUB_STEP_SUMMARY"; echo "Deploy identity check: **PASS** — the FTP_SERVER secret can be \`$HOST\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Deploy identity check: FAIL — the certificate isn't a valid *.hstgr.io one."
          fi

          # A wildcard certificate (*.example.io) needs a real name under it that points to this
          # server. If HOST is an IP, the reverse DNS name usually is one.
          if [[ "$HOST" =~ ^[0-9.]+$ ]]; then
            ptr="$(dig +short -x "$HOST" | sed 's/\.$//' | head -1)"
            echo "Reverse DNS for $HOST: ${ptr:-none}"
            if [ -n "$ptr" ]; then
              back="$(dig +short A "$ptr" | head -5 | tr '\n' ' ')"
              echo "  $ptr resolves to: $back"
              match=no
              for n in $names; do
                case "$ptr" in $n) match=yes ;; esac
              done
              echo "  matches the certificate: $match"
              {
                echo ""
                echo "Reverse DNS for \`$HOST\`: \`$ptr\` (resolves to $back; matches the certificate: **$match**)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Website status
        env:
          SITE: ${{ inputs.site }}
        run: |
          for url in "http://$SITE/" "https://$SITE/" "https://www.$SITE/"; do
            line="$(curl -sS -o /tmp/body -w '%{http_code} → %{redirect_url}' --max-time 20 "$url" 2>&1 || true)"
            title="$(grep -o '<title>[^<]*</title>' /tmp/body 2>/dev/null | head -1 || true)"
            echo "$url  $line  $title"
            echo "- \`$url\` → $line $title" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Redirect chain for http://www.$SITE/packages:"
          curl -sSIL --max-redirs 5 --max-time 20 "http://www.$SITE/packages" | tr -d '\r' | grep -iE '^(HTTP/|location:)' | sed 's/^/  /' || true
          echo "SSL certificate for $SITE:"
          timeout 20 openssl s_client -connect "$SITE:443" -servername "$SITE" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null \
            || echo "  (no valid HTTPS certificate yet — switch on SSL in hPanel → Security → SSL)"
