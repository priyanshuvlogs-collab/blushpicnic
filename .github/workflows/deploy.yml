# ─────────────────────────────────────────────────────────────────────────────
#  Deploy blushpicnic.com to Hostinger.
#
#  MANUAL ONLY: nothing goes live until you press the button, and only from the main branch.
#    GitHub → Actions → "Deploy to Hostinger" → Run workflow → Run workflow
#
#  One-time setup (HANDOVER.md has screenshots-free, step-by-step instructions):
#    Settings → Secrets and variables → Actions → New repository secret:
#      FTP_SERVER    the "FTP IP (hostname)" from hPanel → Files → FTP Accounts (the IP is fine)
#      FTP_USERNAME  the FTP username from the same hPanel page
#      FTP_PASSWORD  the FTP password (change it first if it was ever shared in a chat)
#      SMTP_PASSWORD (optional) the support@ mailbox password: the deploy then writes
#                    blush-config.php next to public_html, so booking emails work
#    (Real values live only in these secrets and in your own deploy.env, never in a file in git.)
#    Optional repository VARIABLES (same page, "Variables" tab):
#      SITE_URL          https://blushpicnic.com (used by the checks after uploading)
#      FTP_PORT          21
#      FTP_CERT_DOMAIN   hstgr.io (default) — the domain on Hostinger's FTP certificate
#      FTP_TLS_SECURITY  strict or loose — normally worked out automatically, see "Encryption"
#    Settings → Environments → production → Deployment branches: "Selected branches" → main
#    (optionally also a required reviewer), so no other branch can reach the live site.
#
#  Encryption: the upload always uses FTPS (FTP over TLS). Before sending the password, the
#  workflow checks the server presents a valid, publicly trusted certificate for Hostinger's
#  FTP domain (*.hstgr.io, or the FTP_CERT_DOMAIN variable), so nobody in between can pose as
#  Hostinger. FTP_TLS_SECURITY (strict/loose) overrides the upload's own name check.
#
#  To deploy automatically on every push to main later, add this under "on:" (and keep
#  workflow_dispatch so you can still deploy by hand):
#      push:
#        branches: [main]
#        paths-ignore: ['**.md', 'docs/**']
#  Tip: then also protect main (Settings → Branches) so only checked changes reach it.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      check_live_site:
        description: Check the live site after uploading
        type: boolean
        default: true

permissions:
  contents: read

# Never run two deploys at once; a second one waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://blushpicnic.com' }}
    steps:
      - name: Check the three FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings → Secrets and variables → Actions (HANDOVER.md → One-time setup)."
            exit 1
          fi
          # Values pasted into GitHub's secret box often carry an invisible line break at the end,
          # which breaks the FTP login. Strip trailing line breaks (never other characters) and pass
          # the tidy values on, masked, to the later steps.
          user="$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')"
          pass="$FTP_PASSWORD"
          while [[ "$pass" == *$'\n' || "$pass" == *$'\r' ]]; do pass="${pass%?}"; done
          [[ "$pass" == "$FTP_PASSWORD" ]] || echo "::warning::FTP_PASSWORD ended with a line break; it was removed for this deploy. (You can re-save the secret without it.)"
          [[ "$user" == "$FTP_USERNAME" ]] || echo "::warning::FTP_USERNAME had spaces or a line break; they were removed for this deploy."
          case "$pass" in *$'\n'*|*$'\r'*) echo "::error::FTP_PASSWORD contains a line break in the middle. Re-save the secret on one line."; exit 1 ;; esac
          [[ "$pass" == " "* || "$pass" == *" " ]] && echo "::warning::FTP_PASSWORD starts or ends with a space. If the login fails, re-save the secret without it."
          echo "::add-mask::$pass"
          echo "FTP_USER_CLEAN=$user" >> "$GITHUB_ENV"
          echo "FTP_PASS_CLEAN=$pass" >> "$GITHUB_ENV"

      # Prove the FTP server is Hostinger's before sending the password: it must present a valid,
      # publicly trusted certificate for FTP_CERT_DOMAIN (Hostinger's is *.hstgr.io). With an IP
      # address in FTP_SERVER the upload can't match the name itself, so after this check it
      # uploads with the name check off ("loose"); with a matching host name it stays "strict".
      - name: Verify the FTP server's certificate
        id: tls
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_CERT_DOMAIN: ${{ vars.FTP_CERT_DOMAIN || 'hstgr.io' }}
        run: |
          # Tidy the secret: spaces, ftp:// or ftps://, a :port or /path are all tolerated.
          host="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          host="${host#ftp://}"; host="${host#ftps://}"; host="${host#sftp://}"; host="${host%%/*}"; host="${host%%:*}"
          [ -n "$host" ] || { echo "::error::The FTP_SERVER secret is empty after removing spaces."; exit 1; }
          # Connect over IPv4 (GitHub's runners have no IPv6 route, which makes connections hang).
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ip="$host"; echo "FTP_SERVER is an IP address."
          else
            ip="$(getent ahostsv4 "$host" | awk 'NR==1{print $1}')"
            echo "FTP_SERVER is a host name; its IPv4 address is ${ip:-(none found)}."
            [ -n "$ip" ] || { echo "::error::The FTP_SERVER host name doesn't resolve to an IPv4 address. Use the \"FTP IP\" from hPanel → Files → FTP Accounts."; exit 1; }
          fi
          if ! timeout 10 bash -c "exec 3<>/dev/tcp/$ip/$FTP_PORT" 2>/dev/null; then
            echo "::error::Can't reach $ip on port $FTP_PORT. Check the FTP_SERVER secret matches the \"FTP IP\" in hPanel → Files → FTP Accounts (and the FTP_PORT variable, if set)."
            exit 1
          fi
          out="$(timeout 30 openssl s_client -starttls ftp -connect "$ip:$FTP_PORT" -servername "deploy-check.$FTP_CERT_DOMAIN" \
                   -verify_return_error -verify_hostname "deploy-check.$FTP_CERT_DOMAIN" </dev/null 2>&1 || true)"
          if ! grep -q 'Verify return code: 0 (ok)' <<<"$out"; then
            echo "$out" | grep -E 'subject=|issuer=|Verify return code|verify error|errno' | head -6 || true
            echo "::error::The FTP server at $ip didn't present a valid certificate for *.$FTP_CERT_DOMAIN — not uploading. Run the 'Check Hostinger connection' workflow with the FTP IP from hPanel."
            exit 1
          fi
          echo "Certificate OK: valid and trusted for *.$FTP_CERT_DOMAIN (server $ip)"
          # Later steps connect to this IPv4 address.
          echo "FTP_HOST_IPV4=$ip" >> "$GITHUB_ENV"
          if [[ "$host" == "$FTP_CERT_DOMAIN" || "$host" == *".$FTP_CERT_DOMAIN" ]]; then
            echo "security=strict" >> "$GITHUB_OUTPUT"
          else
            echo "security=loose" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run build

      # Same checks as ./deploy.sh: key files present, no secrets or saved emails inside, no
      # file outside _astro/ named like a fingerprinted one (.htaccess would cache it for a year),
      # and the business facts the booking emails need.
      - name: Check the build before uploading
        run: |
          for f in index.html 404.html .htaccess sitemap-index.xml robots.txt api/book.php api/form-schema.json api/.htaccess api/lib/.htaccess; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f is missing — the build is incomplete."; exit 1; }
          done
          leaks="$(find dist \( -name 'blush-config.php' -o -name 'deploy*.env' -o -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name '*.eml' -o -path '*/.mail*' -o -path '*/blush-data*' \) -print)"
          if [ -n "$leaks" ]; then
            echo "::error::Secret-looking files or saved emails in dist/ (never upload these): $leaks"
            exit 1
          fi
          if [ "${#FTP_PASS_CLEAN}" -ge 8 ] && grep -rqF -e "$FTP_PASS_CLEAN" dist; then
            echo "Files containing it (paths only):"; grep -rlF -e "$FTP_PASS_CLEAN" dist | head -10
            echo "::error::The FTP password appears inside dist/ — either something copied it into the site, or the password is a word that's on the website (too guessable: change it in hPanel and update the secret)."
            exit 1
          fi
          odd="$(find dist -path dist/_astro -prune -o -type f -print | grep -E '(^|/)([^/]*\.[A-Za-z0-9_-]{8}(_[A-Za-z0-9_-]+)?\.(css|m?js|avif|webp|jpe?g|png|gif|svg|woff2?|ttf|otf)|[0-9a-f]{16}\.(woff2?|ttf|otf))$' || true)"
          if [ -n "$odd" ]; then
            echo "::error::Files outside _astro/ named like fingerprinted build files (they'd be cached for a year; rename them): $odd"
            exit 1
          fi
          grep -q '"phoneDisplay"' dist/api/form-schema.json || { echo "::error::dist/api/form-schema.json has no business facts (phone…) for the booking emails."; exit 1; }
          echo "$(find dist -maxdepth 1 -name '*.html' | wc -l) pages, $(find dist/_astro -type f | wc -l) build files, $(du -sh dist | cut -f1)"

      # The booking handler must work before it goes live: PHP syntax, then the full API test
      # suite against this very build (the runner's own PHP; no browser needed).
      - name: Booking handler checks (php -l, API tests)
        env:
          API_TEST_DIST: dist
          API_TEST_SKIP_BUILD: '1'
        run: |
          php -v | head -1
          find public/api tests/fixtures -name '*.php' -print0 | xargs -0 -n1 php -l
          npm run test:api

      # Uploads only what changed since the last run of this workflow (it keeps a list in
      # <website folder>/.ftp-deploy-sync-state.json, which .htaccess hides from the web). Files
      # that were removed from the site are deleted from the server; anything else already
      # on the server (and blush-config.php, which lives above public_html) is left alone.
      # Pinned to the exact commit of v4.3.5 (a tag can be moved; this action gets the password).
      # To update: look up the new release's commit on GitHub and replace both the hash and the comment.
      - name: Upload to Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ env.FTP_HOST_IPV4 }}
          username: ${{ env.FTP_USER_CLEAN }}
          password: ${{ env.FTP_PASS_CLEAN }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ftps
          security: ${{ vars.FTP_TLS_SECURITY || steps.tls.outputs.security }}
          local-dir: ./dist/
          # Absolute path from the top of the FTP account. On this Hostinger plan FTP logs in to a
          # separate /public_html that no website serves; blushpicnic.com is served from
          # /domains/blushpicnic.com/public_html. Override with the FTP_REMOTE_DIR variable.
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/domains/blushpicnic.com/public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          timeout: 120000
          log-level: standard

      # The booking form's private settings (blush-config.php) live in the folder ABOVE public_html,
      # where the web can't reach them. When the SMTP_PASSWORD secret (the support@ mailbox
      # password) is set, write a minimal config from it — every other setting has a default in
      # public/api/lib/Config.php — and upload it next to public_html. The password only ever
      # exists in the secret and on the server. Without the secret this step changes nothing, so a
      # config made by hand in File Manager is left alone.
      - name: Booking email settings (blush-config.php, outside public_html)
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_CERT_DOMAIN: ${{ vars.FTP_CERT_DOMAIN || 'hstgr.io' }}
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '/domains/blushpicnic.com/public_html/' }}
        run: |
          while [[ "$SMTP_PASSWORD" == *$'\n' || "$SMTP_PASSWORD" == *$'\r' ]]; do SMTP_PASSWORD="${SMTP_PASSWORD%?}"; done
          export SMTP_PASSWORD
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::SMTP_PASSWORD secret not set: blush-config.php was not touched. Add the support@blushpicnic.com mailbox password as the SMTP_PASSWORD secret (or create the file in File Manager) to switch booking emails on."
            exit 0
          fi
          umask 077
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          host="$FTP_HOST_IPV4"
          # Connect by IP but verify TLS against a name under the certificate's domain (checked above).
          name="deploy-check.$FTP_CERT_DOMAIN"
          printf 'machine %s\nlogin "%s"\npassword "%s"\n' "$name" "$FTP_USER_CLEAN" "$FTP_PASS_CLEAN" > "$work/netrc"
          ftp() { curl -sS --ssl-reqd --netrc-file "$work/netrc" --connect-to "$name:$FTP_PORT:$host:$FTP_PORT" "$@"; }
          # The config goes in the folder that holds the website folder (REMOTE_DIR's parent), never
          # anywhere else: check the website folder really is in it first. "//" = absolute FTP path.
          web="${REMOTE_DIR%/}"; web="/${web#/}"; parent="${web%/*}"; leaf="${web##*/}"
          [ -n "$parent" ] || { echo "::error::FTP_REMOTE_DIR has no parent folder for blush-config.php."; exit 1; }
          if ! ftp --list-only "ftp://$name:$FTP_PORT/$parent/" | tr -d '\r' | grep -qx "$leaf"; then
            echo "::error::$leaf isn't in $parent, so the right place for blush-config.php is unclear. Create it by hand in File Manager ($parent/blush-config.php)."
            exit 1
          fi
          php -r 'echo "<?php\n// Written by the Deploy workflow from the SMTP_PASSWORD secret. Other settings: defaults.\nreturn ", var_export(["smtp_password" => getenv("SMTP_PASSWORD")], true), ";\n";' > "$work/blush-config.php"
          php -l "$work/blush-config.php" >/dev/null
          ftp -T "$work/blush-config.php" "ftp://$name:$FTP_PORT/$parent/blush-config.php"
          ftp -Q "SITE CHMOD 600 $parent/blush-config.php" --list-only "ftp://$name:$FTP_PORT/$parent/" >/dev/null 2>&1 \
            || echo "(couldn't set file permissions to 600; the file is outside the website folder either way)"
          echo "blush-config.php uploaded to $parent (next to the website folder)."

      - name: Check the live site
        if: ${{ inputs.check_live_site }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://blushpicnic.com' }}
        run: |
          sleep 5
          ./deploy.sh --check
