# ─────────────────────────────────────────────────────────────────────────────
#  Generate the site's stand-in photos with xAI's Grok image API (scripts/ai-photos.mjs)
#  and commit them to the branch you run it on. Nothing is deployed: run
#  "Deploy to Hostinger" afterwards.
#
#  One-time setup: Settings → Secrets and variables → Actions → New repository secret,
#  name XAI_API_KEY, value = your key from console.x.ai.
#
#  The photos are AI illustrations, not pictures of real events — the site labels them.
#  Swap in real photos with `npm run photos` (see HANDOVER.md) as soon as you have them.
# ─────────────────────────────────────────────────────────────────────────────
name: Generate AI photos

on:
  workflow_dispatch:
    inputs:
      only:
        description: Only these files, comma-separated (e.g. hero.jpg,occasion-*.jpg). Empty = every photo not generated yet
        required: false
        default: ''
        type: string
      force:
        description: Regenerate photos that were generated before
        required: false
        default: false
        type: boolean
      model:
        description: xAI image model (empty = best one the key can use)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ai-photos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Generate photos
        id: gen
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_IMAGE_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error::Add the XAI_API_KEY repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          set +e
          node scripts/ai-photos.mjs "${args[@]}"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Commit whatever was generated, even if some photos failed (a re-run picks up the rest).
      - name: Commit the photos
        env:
          REF: ${{ github.ref_name }}
        run: |
          git add src/assets/photos
          if git diff --cached --quiet; then
            echo "No new photos to commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "AI photos: generate with Grok ($(git diff --cached --name-only | wc -l) files)"
            git push origin "HEAD:$REF"
            {
              echo "### Photos committed to \`$REF\`"
              git show --stat --format= HEAD | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Result
        if: steps.gen.outputs.status != '0'
        run: |
          echo "::error::Some photos failed — see the Generate photos step. Run the workflow again to retry just those."
          exit 1
