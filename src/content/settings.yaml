# ─────────────────────────────────────────────────────────────
#  Blush Picnic — business settings
#  Edit the values on the right of each colon. Keep the quotes.
#  After saving, redeploy (see HANDOVER.md).
# ─────────────────────────────────────────────────────────────
site:
  name: "Blush Picnic"
  domain: "blushpicnic.com"
  url: "https://blushpicnic.com"
  email: "blush.picnic25@gmail.com"
  phoneDisplay: "(647) 878-0539"
  phoneE164: "+16478780539"
  # Pre-written text message for the "Text us" buttons
  smsBody: "Hi Blush Picnic! I'd love to book a picnic. My date is: "
  instagramHandle: "@blush.picnic"
  instagramUrl: "https://www.instagram.com/blush.picnic/"
  tiktokHandle: "@blush.picnic"
  tiktokUrl: "https://www.tiktok.com/@blush.picnic"
  serviceArea: "Toronto and the GTA"
  serviceAreaList:
    - "Toronto"
    - "North York"
    - "Scarborough"
    - "Etobicoke"
    - "East York"
    - "Mississauga"
    - "Brampton"
    - "Vaughan"
    - "Markham"
    - "Richmond Hill"
    - "Oakville"
    - "Pickering"
    - "Ajax"
  replyTime: "within 5 hours"
  # Describe the home page hero photo (src/assets/photos/hero.jpg) for screen readers and Google.
  heroAlt: "Picnic on Toronto Island facing the CN Tower and city skyline: a low table with white roses and pink peonies, a white teepee, cream fringed parasol and pink cushions"
  tagline: "Luxury picnic setups in Toronto & the GTA"
  description: "Luxury picnic setups, proposals, room decor and birthday hampers across Toronto and the GTA. We deliver, set up, style and clean up."
  # Deposits. Change the amounts in the number lines only: the summary sentences fill in
  # {deposit}, {depositPercent}, {securityDeposit} and {securityReturned} from them,
  # so please don't type dollar amounts into the summaries.
  deposit:
    standard: 100
    largeEventPercent: 50
    summary: "A {deposit} booking deposit (or {depositPercent} for larger events) holds your date. It’s non-refundable. The balance is due before your event."
  # Refundable security deposit for the rented decor and equipment
  securityDeposit:
    amount: 100
    returnedWithin: "24–48 hours"
    summary: "A {securityDeposit} refundable security deposit is required for every booking. It’s returned within {securityReturned} after the event, once all rental items are collected and checked."
  taxNote: "before HST"
  locationNote: "Prices vary by location across the GTA. We confirm your exact quote by message."
  # Travel fee by area, added to every quote (picnics, room decor and hamper deliveries).
  # Put a number next to an area once you've decided it (numbers only, no $). null shows
  # "quoted by area": the booking estimate then says the travel fee is confirmed in the quote.
  # The booking form lists these areas, plus "Somewhere else in the GTA" and "Not sure yet".
  travel:
    note: "A travel fee is added by area. We confirm it with your quote."
    areas:
      - name: "Toronto"
        fee: null
      - name: "North York"
        fee: null
      - name: "Scarborough"
        fee: null
      - name: "Etobicoke"
        fee: null
      - name: "East York"
        fee: null
      - name: "Mississauga"
        fee: null
      - name: "Brampton"
        fee: null
      - name: "Vaughan"
        fee: null
      - name: "Markham"
        fee: null
      - name: "Richmond Hill"
        fee: null
      - name: "Oakville"
        fee: null
      - name: "Pickering"
        fee: null
      - name: "Ajax"
        fee: null

  # Analytics — paste your IDs here. Leave empty ("") to switch tracking off.
  # They only load after a visitor accepts cookies.
  analytics:
    ga4Id: ""          # e.g. "G-XXXXXXXXXX"  (PLACEHOLDER — waiting for owner)
    metaPixelId: ""    # e.g. "123456789012345"  (PLACEHOLDER — waiting for owner)

  booking:
    # "php" = send through our own form handler on Hostinger (recommended)
    # "web3forms" = backup service if email sending ever breaks (needs an access key below)
    provider: "php"
    endpoint: "/api/book.php"
    web3formsAccessKey: ""
    letterBoardMaxWords: 7
