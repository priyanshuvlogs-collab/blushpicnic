# ─────────────────────────────────────────────────────────────
#  Packages. Prices are "starting at", before HST. A travel fee by area is added on top
#  (settings.yaml → travel), and the picnic style (styles.yaml) and add-ons (addons.yaml)
#  are chosen separately in the booking form.
#  To change a price, edit priceFrom / extraGuestPrice and redeploy.
#  The extra-guest price is shown next to the price automatically, so
#  don't type amounts into summary or priceNote (an optional extra line
#  under the price). extraGuestPrice: null shows "we'll quote extra guests".
#  Keep the id lines (simple, signature, proposal-romance, celebration) as
#  they are — booking links use them.
#  "includesFrom" names another package: that package's list is inherited
#  in the comparison table ("Everything in the Simple Picnic, plus:").
# ─────────────────────────────────────────────────────────────
- id: simple
  name: "Simple Picnic"
  order: 1
  featured: false
  tagline: "The easy, pretty picnic for two"
  summary: "The essentials, beautifully done: a low table dressed with rugs, cushions, tableware and florals, set up in your spot and cleared away afterwards."
  priceFrom: 250
  guestsIncluded: 2
  guestsMax: null
  guestsLabel: "for 2 guests"
  extraGuestPrice: null
  durationHours: 2
  includesFrom: null
  includes:
    - "Low picnic table"
    - "Rugs and cushions"
    - "Tableware"
    - "Florals"
    - "Letter board with your message"
  bestFor: ["picnic-date", "birthday", "anniversary", "family", "appreciation", "announcement"]
  image: "../assets/photos/pkg-simple.jpg"
  imageAlt: "Simple picnic for two in a park: a low oak table on a cream rug with pink roses in a vase, a jug of pink lemonade, two plates with blush napkins, a blank letter board and cushions"
  priceNote: "Bringing more people? We'll quote extra guests."

