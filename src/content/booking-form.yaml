# ─────────────────────────────────────────────────────────────
#  Booking form questions.
#  The form has 4 steps: 1 What you'd like (service, occasion, package) ·
#  2 When & where · 3 Details & style · 4 Your details (then Review & send).
#
#  Each block below appears for the occasion groups in "appliesTo"
#  ("*" = everyone). Occasion groups are set per occasion in
#  src/content/occasions/<occasion>.md  →  formGroup.
#
#  A question can also depend on another answer:
#    showIf: { field: service, in: ["picnics", "proposals"] }   (one of several answers)
#    showIf: { field: is_surprise, equals: "yes" }               (one answer)
#    showIf: [ {…}, {…} ]                                        (a list: all must hold)
#  Service ids come from src/content/services.yaml: picnics, proposals, room-decor,
#  birthday-hampers, custom-hampers.
#
#  Safe edits: labels, help text, placeholders, options, required.
#  Changing an "id" renames the answer in emails — avoid it.
#  The server checks answers against this same file, so you never
#  need to edit any code to change a question.
# ─────────────────────────────────────────────────────────────

# ── Step 1 ───────────────────────────────────────────────────
- id: core-what
  title: "What you’d like"
  step: 1
  appliesTo: ["*"]
  order: 1
  fields:
    - id: service
      label: "What can we set up for you?"
      type: radio
      source: services
      required: true
    - id: occasion
      label: "What are we celebrating?"
      type: select
      source: occasions
      required: true
      # A proposal is its own occasion, and hampers are for birthdays (or "Something else" for a
      # custom one): the answer follows the service and the question is hidden.
      lockBy:
        field: service
        values:
          proposals: "proposal"
          birthday-hampers: "birthday"
          custom-hampers: "other"
    - id: package
      label: "Which package feels right?"
      type: radio
      source: packages
      required: true
      help: "Not sure? Pick “Help me choose” and we’ll recommend one."
      showIf: { field: service, in: ["picnics", "proposals"] }

# ── Step 2 ───────────────────────────────────────────────────
- id: core-when-where
  title: "When & where"
  step: 2
  appliesTo: ["*"]
  order: 1
  fields:
    - id: date
      label: "Preferred date"
      type: date
      required: true
      half: true
      help: "We’ll confirm availability when we reply."
    - id: backup_date
      label: "Backup date"
      type: date
      half: true
      help: "It helps if your first date is taken."
    - id: start_time
      label: "Preferred start time"
      type: time
      required: true
      showIf: { field: service, in: ["picnics", "proposals", "room-decor"] }
    - id: delivery_slot
      label: "When should it arrive?"
      type: radio
      required: true
      options:
        - "At midnight"
        - "During the day"
      showIf: { field: service, in: ["birthday-hampers", "custom-hampers"] }
    - id: guests_adults
      label: "Adults"
      type: number
      required: true
      min: 1
      max: 300
      half: true
      showIf: { field: service, in: ["picnics", "proposals"] }
    - id: guests_kids
      label: "Kids"
      type: number
      min: 0
      max: 300
      half: true
      showIf: { field: service, in: ["picnics", "proposals"] }
    - id: location_type
      label: "Where would you like your picnic?"
      type: radio
      required: true
      options:
        - "Park"
        - "Beach"
        - "Backyard"
        - "At home (indoors)"
        - "Indoor venue"
        - "Not sure yet — suggest a spot"
      showIf: { field: service, in: ["picnics", "proposals"] }
    - id: room_type
      label: "What kind of room?"
      type: radio
      required: true
      options:
        - "At home"
        - "Hotel room"
        - "Airbnb or rental"
        - "Somewhere else"
      showIf: { field: service, equals: "room-decor" }
    - id: area
      label: "Which area?"
      type: select
      source: areas
      required: true
      help: "A travel fee is added by area and confirmed with your quote."
    - id: location
      label: "Address, park name or area"
      type: text
      required: true
      maxLength: 200
      # "off": this is where the picnic happens (often a park), not the visitor's own address.
      autocomplete: "off"
      placeholder: "e.g. High Park, or Mississauga"
      help: "Prices vary by location across the GTA, so this helps us quote accurately."
      showIf: { field: service, in: ["picnics", "proposals"] }
    - id: room_address
      label: "Address of the room"
      type: text
      required: true
      maxLength: 200
      autocomplete: "off"
      placeholder: "Street address, or the hotel name"
      help: "Only used to plan the setup."
      showIf: { field: service, equals: "room-decor" }
    - id: delivery_address
      label: "Delivery address"
      type: text
      required: true
      maxLength: 200
      autocomplete: "off"
      placeholder: "Where the hamper should arrive"
      showIf: { field: service, in: ["birthday-hampers", "custom-hampers"] }
    - id: budget
      label: "Budget range"
      type: select
      options:
        - "Under $500"
        - "$500 – $800"
        - "$800 – $1,200"
        - "$1,200 – $2,000"
        - "$2,000+"
        - "Not sure yet"

# ── Step 3: occasion details ────────────────────────────────
- id: birthday
  title: "About the birthday"
  step: 3
  appliesTo: ["birthday"]
  order: 1
  fields:
    - id: birthday_name
      label: "Whose birthday is it?"
      type: text
      required: true
      maxLength: 80
      half: true
    - id: birthday_age
      label: "Age they’re turning"
      type: number
      min: 1
      max: 120
      half: true
    - id: birthday_favourites
      label: "Favourite colours or characters"
      type: text
      maxLength: 200
      placeholder: "e.g. lilac and gold, or Bluey"

- id: anniversary
  title: "About your anniversary"
  step: 3
  appliesTo: ["anniversary"]
  order: 1
  fields:
    - id: anniversary_year
      label: "Which anniversary?"
      type: number
      min: 1
      max: 80
      half: true
      placeholder: "e.g. 5"
    - id: anniversary_photos
      label: "Printed photos in the setup?"
      type: radio
      half: true
      options: ["Yes please", "No thanks", "Maybe — tell me more"]
      help: "You can send us the photos after booking."
    - id: anniversary_place
      label: "A place that’s special to you both"
      type: text
      maxLength: 200
      placeholder: "Where you met, your first date…"

- id: romance
  title: "About your person"
  step: 3
  appliesTo: ["romance"]
  order: 1
  fields:
    - id: partner_name
      label: "Your partner’s first name"
      type: text
      required: true
      maxLength: 80
      half: true
      autocomplete: "off"
    - id: partner_colours
      label: "Their favourite colours"
      type: text
      maxLength: 120
      half: true
    - id: partner_flowers
      label: "Their favourite flowers"
      type: text
      maxLength: 120
      placeholder: "e.g. peonies, white roses"
    - id: romance_extras
      label: "Extras you’re considering"
      type: checkboxes
      # Balloon garlands, candle walkways etc. are in "Add-ons" (style section) — don't repeat them here.
      options:
        - "Rose petals and candles"
        - "Family or friends join after"
      help: "No commitment — we’ll include these in your quote. Rose petals and candles come with Proposal & Romance; more add-ons are further down."

- id: sign
  title: "Your sign"
  step: 3
  appliesTo: ["romance", "anniversary", "couple"]
  order: 1.5
  fields:
    - id: sign_wording
      label: "Sign wording"
      type: text
      maxLength: 60
      placeholder: "e.g. Marry Me? or Just Married"
      help: "Included with the Proposal & Romance package. Leave blank if you’re not sure yet."

- id: couple
  title: "About the two of you"
  step: 3
  appliesTo: ["couple"]
  order: 1
  fields:
    - id: couple_names
      label: "Both your names"
      type: text
      required: true
      maxLength: 120
      placeholder: "e.g. Priya & Daniel"
    - id: couple_date
      label: "Engagement or wedding date"
      type: date
      half: true

- id: family
  title: "About the family"
  step: 3
  appliesTo: ["family"]
  order: 1
  fields:
    - id: kids_ages
      label: "Kids’ ages"
      type: text
      maxLength: 80
      placeholder: "e.g. 3, 6 and 9"
      help: "Add the number of kids in step 2."
    - id: kids_activities
      label: "Activities the kids would love"
      type: text
      maxLength: 200
      placeholder: "e.g. colouring, bubbles, games"

- id: honour
  title: "Who we’re celebrating"
  step: 3
  appliesTo: ["honour"]
  order: 1
  fields:
    - id: honouree
      label: "Who is being honoured?"
      type: text
      maxLength: 120
      half: true
      placeholder: "Name, or the team"
    - id: company_name
      label: "Company name"
      type: text
      maxLength: 120
      half: true
      autocomplete: "organization"
      help: "Optional for personal celebrations."
    - id: honour_message
      label: "Message or years of service"
      type: text
      maxLength: 200
      placeholder: "e.g. Thanks for 25 years, Linda!"
    - id: invoice_needed
      label: "Do you need an invoice?"
      type: radio
      options: ["Yes", "No"]

- id: new-baby
  title: "About the new arrival"
  step: 3
  appliesTo: ["new-baby"]
  order: 1
  fields:
    - id: baby_name
      label: "Baby’s name"
      type: text
      maxLength: 80
      half: true
    - id: baby_dob
      label: "Date of birth"
      type: date
      half: true
    - id: quiet_spot
      label: "Would you like a quiet, shaded spot?"
      type: radio
      options: ["Yes please", "No preference"]

- id: baby
  title: "About the parents-to-be"
  step: 3
  appliesTo: ["baby"]
  order: 1
  fields:
    - id: parents_names
      label: "Parents’ names"
      type: text
      required: true
      maxLength: 120
      half: true
    - id: due_date
      label: "Due date or month"
      type: text
      maxLength: 40
      half: true
      placeholder: "e.g. March 2027"
    - id: reveal_method
      label: "How would you like to reveal?"
      type: select
      onlyFor: ["gender-reveal"]
      options:
        - "Balloon box or balloon pop"
        - "Cake cut"
        - "Confetti"
        - "Smoke"
        - "Not sure yet"
      note: "Heads up: confetti, glitter and party poppers aren’t permitted in public parks, and some parks don’t allow smoke. We’ll suggest a park-friendly reveal if needed."

- id: bridal
  title: "About the bride"
  step: 3
  appliesTo: ["bridal"]
  order: 1
  fields:
    - id: bride_name
      label: "Bride’s name"
      type: text
      required: true
      maxLength: 80
      half: true
    - id: wedding_date
      label: "Wedding date"
      type: date
      half: true

# ── Step 3: surprise (everyone) ─────────────────────────────
- id: surprise
  title: "Is it a surprise?"
  step: 3
  appliesTo: ["*"]
  order: 2
  fields:
    - id: is_surprise
      label: "Yes, this is a surprise"
      type: toggle
    - id: surprise_for
      label: "Who is being surprised?"
      type: text
      maxLength: 120
      half: true
      showIf: { field: "is_surprise", equals: "yes" }
    - id: surprise_knows
      label: "Who else knows?"
      type: text
      maxLength: 120
      half: true
      placeholder: "e.g. their sister, my best friend"
      showIf: { field: "is_surprise", equals: "yes" }
    # Not for a hamper delivery: nobody "arrives" and there is no team on site.
    - id: arrival_plan
      label: "How will they arrive?"
      type: textarea
      maxLength: 500
      placeholder: "e.g. I’ll suggest a walk and we’ll arrive at 5:30"
      showIf:
        - { field: "is_surprise", equals: "yes" }
        - { field: service, in: ["picnics", "proposals", "room-decor"] }
    - id: team_presence
      label: "Once it’s set up, should our team…"
      type: radio
      options: ["Stay hidden nearby", "Leave before you arrive", "Not sure — advise me"]
      showIf:
        - { field: "is_surprise", equals: "yes" }
        - { field: service, in: ["picnics", "proposals", "room-decor"] }

# ── Step 3: style & add-ons (everyone) ──────────────────────
- id: style
  title: "Style & add-ons"
  step: 3
  appliesTo: ["*"]
  order: 3
  fields:
    # Only for "Something else" (it has no details section of its own), so we know what to style and quote.
    - id: other_occasion
      label: "What’s the occasion?"
      type: text
      required: true
      maxLength: 120
      onlyFor: ["other"]
      placeholder: "e.g. a graduation or a farewell"
      help: "Tell us what you’re celebrating so we can style it and quote accurately."
    - id: colours_vibe
      label: "Colours and vibe"
      type: text
      maxLength: 200
      placeholder: "e.g. blush and ivory, romantic"
    - id: picnic_style
      label: "How should we set your picnic?"
      type: radio
      source: styles
      help: "The classic low table comes with every package. A table & chair setup or a dome is added to your quote."
      showIf: { field: service, in: ["picnics", "proposals"] }
    - id: letter_board
      label: "Letter board or sign message"
      type: text
      maxLength: 60
      maxWords: 7
      placeholder: "e.g. Happy 30th Maya"
      help: "Up to 7 words."
      showIf: { field: service, in: ["picnics", "proposals", "room-decor"] }
    - id: addons
      label: "Add-ons you’d like a price for"
      type: checkboxes
      source: addons
      showIf: { field: service, in: ["picnics", "proposals", "room-decor"] }
    - id: hamper_vision
      label: "Describe your vision"
      type: textarea
      required: true
      maxLength: 1000
      placeholder: "Who it’s for, what should be in it, colours, a theme…"
      help: "Prefer Instagram? DM us @blush.picnic instead and we’ll take it from there."
      showIf: { field: service, equals: "custom-hampers" }
    - id: card_message
      label: "Message for the card"
      type: text
      maxLength: 200
      placeholder: "e.g. Happy birthday, Sam — love from all of us"
      showIf: { field: service, in: ["birthday-hampers", "custom-hampers"] }
    - id: food_allergies
      label: "Food plans and allergies"
      type: textarea
      maxLength: 500
      placeholder: "Bringing your own food? Adding a charcuterie board or cake? Any allergies?"
      showIf: { field: service, in: ["picnics", "proposals", "room-decor"] }
    - id: dietary
      label: "Allergies or dietary needs"
      type: text
      maxLength: 300
      placeholder: "e.g. nut allergy, vegetarian"
      showIf: { field: service, in: ["birthday-hampers", "custom-hampers"] }
    - id: photo_permission
      label: "May we share photos of your setup on Instagram?"
      type: radio
      options: ["Yes, happy to", "Setup only — no faces", "Please don’t share"]
    - id: notes
      label: "Anything else we should know?"
      type: textarea
      maxLength: 1500

# ── Step 4 ───────────────────────────────────────────────────
- id: contact
  title: "Your details"
  step: 4
  appliesTo: ["*"]
  order: 1
  fields:
    - id: name
      label: "Your name"
      type: text
      required: true
      maxLength: 100
      autocomplete: "name"
    - id: phone
      label: "Phone"
      type: tel
      required: true
      maxLength: 30
      half: true
      autocomplete: "tel"
      help: "For questions about your booking."
    - id: email
      label: "Email"
      type: email
      required: true
      maxLength: 150
      half: true
      autocomplete: "email"
    - id: instagram
      label: "Instagram handle"
      type: text
      maxLength: 60
      half: true
      placeholder: "@yourhandle"
    - id: contact_pref
      label: "Best way to reach you"
      type: radio
      half: true
      options: ["Text", "Call", "Email", "Instagram DM"]
    - id: heard_from
      label: "How did you hear about us?"
      type: select
      options:
        - "Instagram"
        - "Google"
        - "TikTok"
        - "Friend or family"
        - "Saw a setup in person"
        - "Other"
