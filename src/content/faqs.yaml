# ─────────────────────────────────────────────────────────────
#  FAQs. Shown on /faq (grouped by category) and, when
#  showOnHome is true, in the home page preview (5–6 looks best).
#  Categories: booking, pricing, the-day, locations, policies
#  Answers can use **bold** and links like [Policies](/policies).
# ─────────────────────────────────────────────────────────────
- id: how-to-book
  question: "How do I book a picnic?"
  answer: "Send us a booking request through our [booking form](/book) — it takes about three minutes — or text us at {phone}. We reply {replyTime} to confirm your date and your quote. A booking deposit then holds your date."
  category: booking
  order: 1
  showOnHome: true

- id: deposit
  question: "How much is the deposit?"
  answer: "A **{deposit} booking deposit** (or **{depositPercent}** for larger events) holds your date. It's non-refundable. There's also a **{securityDeposit} refundable security deposit**, returned within {securityReturned} after your event once all rental items are collected and checked. The balance is due before your event."
  category: booking
  order: 2
  showOnHome: true

- id: how-far-ahead
  question: "How far in advance should I book?"
  answer: "Send your request as soon as you know your date. If your date is coming up soon, text us at {phone} and we'll tell you quickly whether we can make it work."
  category: booking
  order: 3

- id: surprise
  question: "Can you help me keep it a surprise?"
  answer: "Yes. The booking form has a surprise section where you tell us who's being surprised, who else knows, how they'll arrive, and whether you'd like our team to stay hidden nearby or leave before you arrive."
  category: booking
  order: 4
  showOnHome: true

- id: cost
  question: "How much does a luxury picnic cost?"
  answer: "Our **Signature Picnic** starts at {price:signature} for {guests:signature} (+{extraGuest:signature} per extra guest), **Proposal & Romance** starts at {price:proposal-romance} for {guests:proposal-romance}, and **Celebration** starts at {price:celebration} for {guests:celebration}. All prices are starting prices, before HST, and vary by location. See [all packages](/packages)."
  category: pricing
  order: 1
  showOnHome: true

- id: location-price
  question: "Why does the price depend on location?"
  answer: "We bring everything to you and set up on site, anywhere in Toronto and the GTA, so travel and setup differ from place to place. We confirm your exact quote by message before you pay a deposit."
  category: pricing
  order: 2

- id: hst
  question: "Is HST included?"
  answer: "No — all prices on our site are before HST."
  category: pricing
  order: 3

- id: extra-guests
  question: "Can I add more guests?"
  answer: "Yes. The Signature Picnic is {extraGuest:signature} per extra guest, before HST. The Celebration package covers {guests:celebration}, and we'll quote larger groups. For the Proposal & Romance package, tell us who's joining and we'll include them in your quote."
  category: pricing
  order: 4

- id: whats-included
  question: "What's included in a picnic?"
  answer: "We deliver, set up, style and clean up. The Signature Picnic includes a low table, rugs, cushions, tableware, glassware, florals, a letter board message, a Bluetooth speaker and games. The other packages build on it — see [packages](/packages)."
  category: the-day
  order: 1

- id: food
  question: "Is food included?"
  answer: "Food isn't part of the packages, so you're welcome to bring your own. You can also add a grazing board or a custom cake when you book — just tick them in the form, along with any allergies."
  category: the-day
  order: 2
  showOnHome: true

- id: clean-up
  question: "Do we need to clean up afterwards?"
  answer: "No — when your time is up, we come back and pack away all the decor and equipment. We just ask that you take your own food, drinks and rubbish with you so the space is left clean."
  category: the-day
  order: 3

- id: duration
  question: "How long is a picnic?"
  answer: "The Signature Picnic is {hours:signature}, Proposal & Romance is {hours:proposal-romance}, and Celebration is {hours:celebration}. Extra time is subject to availability, must be requested before your booking ends, and has an additional charge."
  category: the-day
  order: 4

- id: balance
  question: "When is the balance due?"
  answer: "Full payment is due before your event begins — we start setting up once payment is complete."
  category: booking
  order: 5

- id: late
  question: "What if we're running late?"
  answer: "Your booking includes a 30–45 minute grace period. If you arrive more than 45 minutes late without letting us know, your booking may be rescheduled based on availability — so text us at {phone} if you're held up."
  category: the-day
  order: 5

- id: where
  question: "Where can you set up?"
  answer: "Parks, beaches, backyards, homes and indoor venues across Toronto and the GTA. Not sure where to go? Choose “Not sure yet” in the booking form and we'll suggest a spot."
  category: locations
  order: 1

- id: areas
  question: "Which areas do you serve?"
  answer: "We come to you anywhere in {serviceArea}, including North York, Scarborough, Etobicoke, East York, Mississauga, Brampton, Vaughan, Markham, Richmond Hill, Oakville, Pickering and Ajax. Prices vary by location, so tell us where you'd like your picnic and we'll confirm your quote."
  category: locations
  order: 1.5

- id: permits
  question: "Do I need a park permit?"
  answer: "If your chosen park or venue requires a permit, you're responsible for getting it. Rules differ between parks and cities across the GTA — see our [permit notes](/policies#permits)."
  category: locations
  order: 2

- id: confetti
  question: "Can we use confetti or party poppers?"
  answer: "Not in public parks — party poppers, confetti, glitter and similar items aren't permitted there. If they're used, you're responsible for cleaning the area completely before you leave. Planning a reveal? Tell us and we'll suggest a park-friendly option."
  category: locations
  order: 3

- id: weather
  question: "What happens if it rains?"
  answer: "If unsafe weather — like heavy rain, thunderstorms or high winds — stops your picnic going ahead, we'll gladly reschedule to another available date. Your booking deposit is non-refundable but is applied to the rescheduled picnic. Refunds aren't provided for weather-related cancellations. Read the [weather policy](/policies#weather)."
  category: policies
  order: 1
  showOnHome: true

- id: refund
  question: "What if I need to cancel?"
  answer: "Booking deposits are non-refundable. Cancellations made within 48 hours of the event aren't eligible for a refund of payments made. See our [cancellation policy](/policies#cancellation)."
  category: policies
  order: 2

- id: damage
  question: "What if something gets damaged?"
  answer: "You're responsible for the rental items during your booking. Lost, damaged, broken, heavily stained or unreturned items may be deducted from your {securityDeposit} security deposit, and any cost above it is charged separately. See our [damage policy](/policies#damage)."
  category: policies
  order: 3
